[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "czreg"
version = "0.3.0"
description = "Typed async clients for the Czech public registers: ARES (VR, RES, RŽP, ROS, NRPZS, RPSH, RCNS, SZR, RŠ, CEÚ), ISIR, and the VAT payer register (DPH)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=9.0",
]

[project.urls]
Repository = "https://github.com/jogobeny/czreg"

[project.optional-dependencies]
ratelimit = ["pyrate-limiter>=3.7"]

[project.scripts]
czreg = "czreg.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pyrate-limiter>=3.7",
    "datamodel-code-generator[ruff]>=0.83.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "I", "G", "W505"]
logger-objects = ["loguru.logger"]

[tool.ruff.lint.per-file-ignores]
"src/czreg/ares/models/*" = ["W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.basedpyright]
reportUnusedCallResult = false
